name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust / ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build CLI release
        run: cargo build --release -p processfork

  coverage:
    name: coverage (≥ 85% lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Coverage excludes pf-py and pf-ts because those are cdylib
      # bindings exercised from Python/TypeScript SDK tests, not from
      # Rust. See coverage/README.md.
      - name: measure
        run: |
          cargo llvm-cov --workspace \
            --no-default-features \
            --features="hf-live oci-live s3-live ipfs-live" \
            --ignore-filename-regex "pf-py|pf-ts" \
            --json --output-path coverage.json
      - name: enforce ≥ 85% line coverage
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("coverage.json"))
          lines = d["data"][0]["totals"]["lines"]
          pct = lines["percent"]
          floor = 85.0
          print(f"::notice::line coverage {pct:.2f}% ({lines['covered']}/{lines['count']})")
          if pct < floor:
              sys.exit(f"::error::line coverage {pct:.2f}% < {floor}% floor")
          PY
      # Also publish lcov to codecov for delta reporting (informational).
      - name: lcov for codecov
        if: always()
        run: |
          cargo llvm-cov --workspace \
            --no-default-features \
            --features="hf-live oci-live s3-live ipfs-live" \
            --ignore-filename-regex "pf-py|pf-ts" \
            --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: lcov.info
          fail_ci_if_error: false

  python-bindings:
    name: python bindings (pf-py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - run: maturin build -m crates/pf-py/Cargo.toml --release --features extension-module

  ts-bindings:
    name: ts bindings (pf-ts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @napi-rs/cli@2
      - run: napi build --release
        working-directory: crates/pf-ts

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
