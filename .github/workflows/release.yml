name: Release

# Triggers on a tag push of the form v1.0.0 / v1.0.1 / etc.
#
# PyPI uses **Trusted Publishing** (OIDC) — no PYPI_API_TOKEN needed.
# Operator must enable Trusted Publishing once at:
#   https://pypi.org/manage/project/<project>/settings/publishing/
# for processfork *and* every processfork-<adapter>, with this repo
# (manav8498/processfork), workflow file (release.yml), and the env
# name `pypi` as the trust anchor.
#
# Operator-supplied secrets required for the rest:
#   NPM_TOKEN               — npm account token, scoped to @processfork/sdk
#   CARGO_REGISTRY_TOKEN    — crates.io API token
#   GHCR_TOKEN              — GHCR push token (or use GITHUB_TOKEN with packages:write)
#   COSIGN_PRIVATE_KEY      — optional; if absent we sign keylessly via Sigstore.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # GitHub Releases
  packages: write   # GHCR
  id-token: write   # Sigstore keyless signing

jobs:
  # ----------------- Cross-platform CLI binaries -----------------
  build-cli:
    name: pf binary / ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release -p processfork
        run: cargo build --release --target ${{ matrix.target }} -p processfork
      - name: stage binary
        run: |
          set -e
          mkdir -p staging
          cp target/${{ matrix.target }}/release/pf staging/pf-${{ matrix.target }}
          (cd staging && shasum -a 256 pf-${{ matrix.target }} > pf-${{ matrix.target }}.sha256)
      - uses: sigstore/cosign-installer@v3
      - name: sign binary keylessly
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature staging/pf-${{ matrix.target }}.sig \
            --output-certificate staging/pf-${{ matrix.target }}.crt \
            staging/pf-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pf-${{ matrix.target }}
          path: staging/

  # ----------------- Python wheel matrix -----------------
  # 5-platform coverage (the four PyPI cares about plus Linux aarch64):
  # macOS arm64, macOS x86_64, Linux x86_64, Linux aarch64, Windows x86_64.
  # cp39-abi3 single-wheel-per-arch (we use pyo3 abi3-py39).
  #
  # Linux jobs use PyO3/maturin-action so maturin runs inside the
  # official manylinux_2_28 Docker image (Ubuntu 24's native glibc is
  # 2.39 — too new to satisfy manylinux_2_28 directly).
  # macOS + Windows build natively; no manylinux constraint applies.
  build-py-native:
    name: python wheel / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     target: aarch64-apple-darwin }
          - { os: macos-14,     target: x86_64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: build wheel
        shell: bash
        run: |
          maturin build --release \
            --target ${{ matrix.target }} \
            -m crates/pf-py/Cargo.toml \
            --features extension-module \
            --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/

  build-py-linux:
    name: python wheel / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          rust-toolchain: "1.91"
          working-directory: crates/pf-py
          args: --release --features extension-module --strip --out ../../target/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/

  # ----------------- TypeScript napi binaries -----------------
  build-ts:
    name: napi binary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @napi-rs/cli@2
        working-directory: crates/pf-ts
      - run: ./node_modules/.bin/napi build --release --platform
        working-directory: crates/pf-ts
      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.os }}
          path: crates/pf-ts/*.node

  # ----------------- GitHub Release + cosign -----------------
  release:
    name: github release
    needs: [build-cli, build-py-native, build-py-linux, build-ts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: assemble release notes
        run: |
          # Pull the latest [Unreleased] / [vX.Y.Z] section from CHANGELOG
          awk '/^## /{i++} i==2{exit} {print}' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: false
          # Non-overlapping globs only — the `pf-*` glob already covers
          # the .sig/.crt/.sha256 sidecars; listing them separately
          # double-uploaded each asset and tripped the action's
          # metadata-update endpoint.
          files: |
            artifacts/pf-*/pf-*
            artifacts/wheels-*/*.whl
            artifacts/napi-*/*.node

  # ----------------- crates.io publishes -----------------
  publish-crates:
    name: crates.io
    needs: release
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      # Order matters — bottom-up by the dep graph.
      - run: cargo publish -p pf-core    --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-model   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-cache   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-world   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-effects --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-merge   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-registry --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p processfork     --token "$CARGO_REGISTRY_TOKEN"

  # ----------------- PyPI (Trusted Publishing via OIDC) -----------------
  # No PYPI_API_TOKEN required. Operator must enable Trusted Publishing
  # at https://pypi.org/manage/project/<project>/settings/publishing/
  # for processfork *and* every processfork-<adapter>, with this repo
  # (manav8498/processfork), workflow file (release.yml), and the env
  # name `pypi` below as the trust anchor.
  publish-pypi-core:
    name: pypi / processfork (core wheels)
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: collect every wheel into one dir
        run: |
          mkdir -p dist/
          cp artifacts/wheels-*/*.whl dist/
          ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-pypi-adapters:
    name: pypi / processfork-${{ matrix.adapter }}
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        adapter: [claude-code, langgraph, openinterpreter, vllm, sglang, autogen, crewai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: build sdist + wheel
        working-directory: adapters/pf-${{ matrix.adapter }}
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/pf-${{ matrix.adapter }}/dist/
          skip-existing: true

  # ----------------- npm -----------------
  publish-npm:
    name: npm
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: stage napi binaries
        run: |
          # The napi loader (index.js) requires ./processfork.<platform>.node
          # at the package root. v1.0.4 audit caught this: binaries were
          # being staged into binaries/ which the `files` glob in
          # package.json doesn't pick up, so the published tarball had
          # NO native binary and `import` failed at install time.
          set -e
          shopt -s nullglob
          binaries=( artifacts/napi-*/*.node )
          if [[ ${#binaries[@]} -eq 0 ]]; then
            echo "::error::no napi binaries found in artifacts/"
            exit 1
          fi
          for b in "${binaries[@]}"; do
            cp -v "$b" crates/pf-ts/
          done
          echo "staged native binaries:"
          ls -lh crates/pf-ts/*.node
      - name: verify package contents include .node files
        run: |
          # Dry-run pack and grep for .node entries — fail fast if the
          # publish would ship without a native binary.
          set -e
          cd crates/pf-ts
          contents=$(npm pack --dry-run 2>&1 | tee /tmp/npm-pack.log)
          if ! echo "$contents" | grep -qE '\.node'; then
            echo "::error::npm pack would not include any .node binary; aborting publish"
            exit 1
          fi
      - run: npm publish --access public
        working-directory: crates/pf-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ----------------- GHCR docker -----------------
  publish-ghcr:
    name: ghcr
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/processfork:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/processfork:latest
