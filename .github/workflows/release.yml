name: Release

# Triggers on a tag push of the form v1.0.0 / v1.0.1 / etc.
# Operator-supplied secrets required for the publish steps:
#   PYPI_API_TOKEN          — PyPI account token, scoped to processfork*
#   NPM_TOKEN               — npm account token, scoped to @processfork/sdk
#   CARGO_REGISTRY_TOKEN    — crates.io API token
#   GHCR_TOKEN              — GHCR push token (or use GITHUB_TOKEN with packages:write)
#   COSIGN_PRIVATE_KEY      — optional; if absent we sign keylessly via Sigstore.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # GitHub Releases
  packages: write   # GHCR
  id-token: write   # Sigstore keyless signing

jobs:
  # ----------------- Cross-platform CLI binaries -----------------
  build-cli:
    name: pf binary / ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release -p processfork
        run: cargo build --release --target ${{ matrix.target }} -p processfork
      - name: stage binary
        run: |
          set -e
          mkdir -p staging
          cp target/${{ matrix.target }}/release/pf staging/pf-${{ matrix.target }}
          (cd staging && shasum -a 256 pf-${{ matrix.target }} > pf-${{ matrix.target }}.sha256)
      - uses: sigstore/cosign-installer@v3
      - name: sign binary keylessly
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature staging/pf-${{ matrix.target }}.sig \
            --output-certificate staging/pf-${{ matrix.target }}.crt \
            staging/pf-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pf-${{ matrix.target }}
          path: staging/

  # ----------------- Python wheel matrix -----------------
  build-py:
    name: python wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: build wheel
        run: maturin build --release -m crates/pf-py/Cargo.toml --features extension-module --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/

  # ----------------- TypeScript napi binaries -----------------
  build-ts:
    name: napi binary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @napi-rs/cli@2
        working-directory: crates/pf-ts
      - run: ./node_modules/.bin/napi build --release --platform
        working-directory: crates/pf-ts
      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.os }}
          path: crates/pf-ts/*.node

  # ----------------- GitHub Release + cosign -----------------
  release:
    name: github release
    needs: [build-cli, build-py, build-ts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: assemble release notes
        run: |
          # Pull the latest [Unreleased] / [vX.Y.Z] section from CHANGELOG
          awk '/^## /{i++} i==2{exit} {print}' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/pf-*
            artifacts/**/pf-*.sig
            artifacts/**/pf-*.crt
            artifacts/**/pf-*.sha256
            artifacts/wheels-*/*.whl
            artifacts/napi-*/*.node

  # ----------------- crates.io publishes -----------------
  publish-crates:
    name: crates.io
    needs: release
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      # Order matters — bottom-up by the dep graph.
      - run: cargo publish -p pf-core    --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-model   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-cache   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-world   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-effects --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-merge   --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p pf-registry --token "$CARGO_REGISTRY_TOKEN"
      - run: cargo publish -p processfork     --token "$CARGO_REGISTRY_TOKEN"

  # ----------------- PyPI -----------------
  publish-pypi:
    name: pypi
    needs: release
    runs-on: ubuntu-24.04
    env:
      MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin twine
      # Publish the cdylib wheel for every (os, arch).
      - run: |
          for whl in artifacts/wheels-*/*.whl; do
            twine upload --non-interactive "$whl"
          done
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      # Plus the per-adapter pure-Python pkgs.
      - run: |
          for adapter in claude-code langgraph openinterpreter vllm sglang autogen crewai; do
            cd "adapters/pf-$adapter"
            python -m pip install build
            python -m build
            twine upload --non-interactive dist/*
            cd "$GITHUB_WORKSPACE"
          done
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # ----------------- npm -----------------
  publish-npm:
    name: npm
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: stage napi binaries
        run: |
          mkdir -p crates/pf-ts/binaries
          cp artifacts/napi-*/*.node crates/pf-ts/binaries/ || true
      - run: npm publish --access public
        working-directory: crates/pf-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ----------------- GHCR docker -----------------
  publish-ghcr:
    name: ghcr
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/processfork:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/processfork:latest
