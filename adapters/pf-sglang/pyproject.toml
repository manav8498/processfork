[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processfork-sglang"
version = "0.1.0.dev0"
description = "ProcessFork plugin for SGLang ≥0.5 — RadixAttention prefix-share preserved across snapshot/restore."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ProcessFork Authors" }]
dependencies = ["processfork>=0.1.0.dev0"]

[project.optional-dependencies]
sglang = ["sglang>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["processfork_sglang"]
