[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processfork-openinterpreter"
version = "0.1.0.dev0"
description = "ProcessFork wrapper for OpenInterpreter — undo destructive shell commands via pf checkout."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ProcessFork Authors" }]
dependencies = [
    "processfork>=0.1.0.dev0",
]

[project.optional-dependencies]
oi = ["open-interpreter>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["processfork_openinterpreter"]
