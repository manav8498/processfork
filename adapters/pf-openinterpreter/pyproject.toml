[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processfork-openinterpreter"
version = "1.0.0"
description = "ProcessFork wrapper for OpenInterpreter — undo destructive shell commands via pf checkout."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "manav8498", email = "manavpatel91570@gmail.com" }]
dependencies = [
    "processfork>=1.0.0",
]

[project.optional-dependencies]
oi = ["open-interpreter>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["processfork_openinterpreter"]
