[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processfork-langgraph"
version = "1.0.0"
description = "ProcessFork checkpointer for LangGraph — full four-layer snapshots at every node boundary."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "manav8498", email = "manavpatel91570@gmail.com" }]
dependencies = [
    "processfork>=1.0.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["processfork_langgraph"]
