[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processfork-claude-code"
version = "0.1.0.dev0"
description = "ProcessFork integration for Claude Code — adds /snapshot, /fork, /merge slash commands."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ProcessFork Authors" }]
dependencies = [
    "processfork>=0.1.0.dev0",
]

[project.scripts]
pf-wrap-claude = "processfork_claude_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["processfork_claude_code"]
