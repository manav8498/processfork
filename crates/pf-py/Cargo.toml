[package]
name = "pf-py"
description = "ProcessFork Python bindings (pyo3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_pf_py"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Enable when building the cdylib for Python (maturin sets this automatically).
# Off by default so `cargo test` can link libpython for the rlib half.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pf-core    = { workspace = true }
pf-world   = { workspace = true }
pf-effects = { workspace = true }
pf-merge   = { workspace = true }
pf-model   = { workspace = true }
pyo3       = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
# v1.0.9 audit fix (env scrub + HMAC-chained ledger in the SDK):
# regex = default-scrub regex; hex/ring = session-secret material that
# matches the CLI's tamper-detection-mode header.
regex      = "1.10"
hex        = { workspace = true }
ring       = { workspace = true }
