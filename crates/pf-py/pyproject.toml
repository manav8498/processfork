[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "processfork"
# Keep in sync with workspace.package.version in /Cargo.toml — maturin
# reads the wheel version from here, not from Cargo.toml.
version = "1.0.6"
description = "fork() for AI agents — snapshot, branch, and merge live agent state."
readme = "../../README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "manav8498", email = "manavpatel91570@gmail.com" }]
keywords = ["llm", "agents", "snapshot", "fork", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage      = "https://github.com/manav8498/processfork"
Repository    = "https://github.com/manav8498/processfork"
Documentation = "https://github.com/manav8498/processfork/tree/main/docs"
Issues        = "https://github.com/manav8498/processfork/issues"
Changelog     = "https://github.com/manav8498/processfork/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "processfork._pf_py"
python-source = "python"
features = ["pyo3/extension-module", "extension-module"]
manifest-path = "Cargo.toml"
strip = true
