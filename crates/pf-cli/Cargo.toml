[package]
# Crate name is `processfork` (what `cargo install processfork` looks
# up); the binary it produces is still named `pf` (see [[bin]] below).
# `pf-cli` was the original workspace name but it's already squatted
# on crates.io by an unrelated project (`rukai/pf_sandbox`).
name = "processfork"
description = "ProcessFork CLI — the `pf` binary. Snapshot, branch, and merge live AI agent state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pf"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pf-core      = { workspace = true }
pf-cache     = { workspace = true }
pf-world     = { workspace = true }
pf-effects   = { workspace = true }
pf-model     = { workspace = true }
pf-merge     = { workspace = true }
pf-registry  = { workspace = true }

clap         = { workspace = true }
clap_complete= { workspace = true }
indicatif    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
serde_json   = { workspace = true }

[target.'cfg(unix)'.dependencies]
# SIGSTOP/SIGCONT for `pf snapshot --pause-pid` (v1.0.4 audit fix
# for torn-state captures during concurrent agent writes).
nix          = { workspace = true }

[dev-dependencies]
assert_cmd   = "2.0"
predicates   = "3.1"
tempfile     = { workspace = true }
