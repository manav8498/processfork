[package]
name = "pf-ts"
description = "ProcessFork TypeScript bindings (napi-rs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
pf-core     = { workspace = true }
pf-world    = { workspace = true }
pf-effects  = { workspace = true }
pf-merge    = { workspace = true }
pf-model    = { workspace = true }
napi        = { workspace = true, features = ["serde-json"] }
napi-derive = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }

[build-dependencies]
napi-build = "2.1"
