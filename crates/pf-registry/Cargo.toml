[package]
name = "pf-registry"
description = "ProcessFork registry adapters: file, Hugging Face Hub, S3-compatible, IPFS, local OCI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# HF / S3 / IPFS / OCI live HTTP code is on by default in v1.0.2;
# v1.0.1 had it gated. Disable with `--no-default-features` for fully
# air-gapped builds that only want the FileRegistry.
default = ["hf-live", "s3-live", "ipfs-live", "oci-live"]
hf-live   = ["dep:reqwest", "dep:base64"]
s3-live   = ["dep:reqwest"]
ipfs-live = ["dep:reqwest"]
oci-live  = ["dep:reqwest", "dep:base64"]

[dependencies]
pf-core    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tokio      = { workspace = true }
async-trait = "0.1"
reqwest    = { workspace = true, optional = true }
base64     = { workspace = true, optional = true }
zstd       = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
ring       = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
tokio      = { workspace = true }
walkdir    = "2.5"
wiremock   = { workspace = true }
