[package]
name = "pf-microbench"
description = "Criterion microbenchmarks for the snapshot/fork/merge hot paths."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
pf-core    = { path = "../../crates/pf-core" }
pf-cache   = { path = "../../crates/pf-cache" }
pf-merge   = { path = "../../crates/pf-merge" }
serde_json = "1.0"
tempfile   = "3.13"
chrono     = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "snapshot"
harness = false

[[bench]]
name    = "cache_round_trip"
harness = false
