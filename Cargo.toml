[workspace]
resolver = "2"
members = [
    "crates/pf-core",
    "crates/pf-model",
    "crates/pf-cache",
    "crates/pf-world",
    "crates/pf-effects",
    "crates/pf-merge",
    "crates/pf-registry",
    "crates/pf-cli",
    "crates/pf-py",
    "crates/pf-ts",
    # Examples are workspace members so `cargo build --workspace` covers them,
    # but excluded from default-members so `cargo check` stays fast.
    "examples/01-hello-fork",
    # Microbench is a workspace member so its deps stay in sync; default-
    # members excludes it so `cargo check` is fast and `cargo bench` is
    # opt-in via `-p pf-microbench`.
    "benchmarks/microbench",
]
default-members = [
    "crates/pf-core",
    "crates/pf-model",
    "crates/pf-cache",
    "crates/pf-world",
    "crates/pf-effects",
    "crates/pf-merge",
    "crates/pf-registry",
    "crates/pf-cli",
]

[workspace.package]
version = "1.0.14"
edition = "2024"
# MSRV bumps:
#   1.85 → 1.88: the `home` crate (transitive via cargo-internals)
#                started requiring 1.88 (discovered Phase 12, A-005).
#   1.88 → 1.91: aws-sdk-s3 1.131.0 + aws-config 1.8.16 require 1.91.1
#                (added in v1.0.2 for the s3:// registry adapter; A-010).
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/manav8498/processfork"
homepage = "https://github.com/manav8498/processfork"
authors = ["manav8498 <manavpatel91570@gmail.com>"]
readme = "README.md"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# "ProcessFork", "LoRA", "DARE", etc. are proper nouns, not identifiers.
doc_markdown = "allow"

[workspace.dependencies]
# Internal crates
pf-core    = { path = "crates/pf-core",    version = "1.0.14" }
pf-model   = { path = "crates/pf-model",   version = "1.0.14" }
pf-cache   = { path = "crates/pf-cache",   version = "1.0.14" }
pf-world   = { path = "crates/pf-world",   version = "1.0.14" }
pf-effects = { path = "crates/pf-effects", version = "1.0.14" }
pf-merge   = { path = "crates/pf-merge",   version = "1.0.14" }
pf-registry= { path = "crates/pf-registry",version = "1.0.14" }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# bincode 1.x went unmaintained 2025-11; we never `use`d it (every blob
# format is JSON in v1). Tracked under deferred_to_v2 if a binary
# wire format becomes worth the dep cost.
rkyv = { version = "0.7", features = ["validation"] }

# Bytes / IO
bytes = "1.7"
zstd = "0.13"
tempfile = "3.13"

# Hashing / Crypto
sha2 = "0.10"
hex = "0.4"
ring = "0.17"

# Error handling / logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# Filesystem / OS
nix = { version = "0.29", features = ["fs", "process", "user", "signal"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
# base64 — needed by the HF Hub adapter to encode blob bodies in the
# multi-file commit endpoint (HF's NDJSON commit API requires base64).
base64 = "0.22"
# wiremock — in-process HTTP mock server for HF/S3/OCI registry tests
# without hitting the live services. Dev-only.
wiremock = "0.6"
# AWS S3 SDK — used by the s3:// registry adapter for real SigV4 +
# multi-region + R2/MinIO compatibility. Justified per megaprompt §7
# ("S3: aws-sdk-s3.").
# Note: the `rustls` feature on aws-sdk-s3 / aws-config activates
# `aws-smithy-runtime/tls-rustls`, which in turn activates
# `aws-smithy-http-client?/legacy-rustls-ring` — pulling in rustls 0.21 +
# rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). The replacement
# `default-https-client` feature wires the modern rustls 0.23 + aws-lc-rs
# stack via `aws-smithy-http-client?/rustls-aws-lc`, which has no
# outstanding advisories. (Verified v1.0.8.)
aws-sdk-s3 = { version = "1.74", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-config = { version = "1.5", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.7"

# Chrome DevTools Protocol over WebSocket — used by the world layer's
# browser DOM capture (Playwright/Puppeteer sandboxes per §M2 World).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"], default-features = false }
futures-util = { version = "0.3", default-features = false }

# Bindings
# `extension-module` is opt-in per-crate (pf-py turns it on under the
# `extension-module` feature so `cargo test` can still link libpython).
pyo3 = { version = "0.24", features = ["abi3-py39", "generate-import-lib"] }
napi = { version = "2.16", features = ["napi8", "tokio_rt"] }
napi-derive = "2.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.bench]
debug = true
