[workspace]
resolver = "2"
members = [
    "crates/pf-core",
    "crates/pf-model",
    "crates/pf-cache",
    "crates/pf-world",
    "crates/pf-effects",
    "crates/pf-merge",
    "crates/pf-registry",
    "crates/pf-cli",
    "crates/pf-py",
    "crates/pf-ts",
]
default-members = [
    "crates/pf-core",
    "crates/pf-model",
    "crates/pf-cache",
    "crates/pf-world",
    "crates/pf-effects",
    "crates/pf-merge",
    "crates/pf-registry",
    "crates/pf-cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/processfork/processfork"
homepage = "https://processfork.dev"
authors = ["ProcessFork Authors"]
readme = "README.md"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# "ProcessFork", "LoRA", "DARE", etc. are proper nouns, not identifiers.
doc_markdown = "allow"

[workspace.dependencies]
# Internal crates
pf-core    = { path = "crates/pf-core",    version = "0.1.0-dev" }
pf-model   = { path = "crates/pf-model",   version = "0.1.0-dev" }
pf-cache   = { path = "crates/pf-cache",   version = "0.1.0-dev" }
pf-world   = { path = "crates/pf-world",   version = "0.1.0-dev" }
pf-effects = { path = "crates/pf-effects", version = "0.1.0-dev" }
pf-merge   = { path = "crates/pf-merge",   version = "0.1.0-dev" }
pf-registry= { path = "crates/pf-registry",version = "0.1.0-dev" }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rkyv = { version = "0.7", features = ["validation"] }

# Bytes / IO
bytes = "1.7"
zstd = "0.13"
tempfile = "3.13"

# Hashing / Crypto
sha2 = "0.10"
hex = "0.4"
ring = "0.17"

# Error handling / logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# Filesystem / OS
nix = { version = "0.29", features = ["fs", "process", "user"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Bindings
# `extension-module` is opt-in per-crate (pf-py turns it on under the
# `extension-module` feature so `cargo test` can still link libpython).
pyo3 = { version = "0.22", features = ["abi3-py39"] }
napi = { version = "2.16", features = ["napi8", "tokio_rt"] }
napi-derive = "2.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.bench]
debug = true
