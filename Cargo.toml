[workspace]
resolver = "2"
members = [
    "crates/pf-core",
    "crates/pf-model",
    "crates/pf-cache",
    "crates/pf-world",
    "crates/pf-effects",
    "crates/pf-merge",
    "crates/pf-registry",
    "crates/pf-cli",
    "crates/pf-py",
    "crates/pf-ts",
    # Examples are workspace members so `cargo build --workspace` covers them,
    # but excluded from default-members so `cargo check` stays fast.
    "examples/01-hello-fork",
    # Microbench is a workspace member so its deps stay in sync; default-
    # members excludes it so `cargo check` is fast and `cargo bench` is
    # opt-in via `-p pf-microbench`.
    "benchmarks/microbench",
]
default-members = [
    "crates/pf-core",
    "crates/pf-model",
    "crates/pf-cache",
    "crates/pf-world",
    "crates/pf-effects",
    "crates/pf-merge",
    "crates/pf-registry",
    "crates/pf-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
# Bumped 1.85 → 1.88 because the `home` crate (a transitive dep of
# cargo-internals reachable via several of our deps) requires 1.88;
# discovered by `docker build .` against rust:1.85-slim. Tracked in
# claude-progress.json/assumptions[].
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/manav8498/processfork"
homepage = "https://github.com/manav8498/processfork"
authors = ["manav8498 <manavpatel91570@gmail.com>"]
readme = "README.md"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# "ProcessFork", "LoRA", "DARE", etc. are proper nouns, not identifiers.
doc_markdown = "allow"

[workspace.dependencies]
# Internal crates
pf-core    = { path = "crates/pf-core",    version = "1.0.0" }
pf-model   = { path = "crates/pf-model",   version = "1.0.0" }
pf-cache   = { path = "crates/pf-cache",   version = "1.0.0" }
pf-world   = { path = "crates/pf-world",   version = "1.0.0" }
pf-effects = { path = "crates/pf-effects", version = "1.0.0" }
pf-merge   = { path = "crates/pf-merge",   version = "1.0.0" }
pf-registry= { path = "crates/pf-registry",version = "1.0.0" }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# bincode 1.x went unmaintained 2025-11; we never `use`d it (every blob
# format is JSON in v1). Tracked under deferred_to_v2 if a binary
# wire format becomes worth the dep cost.
rkyv = { version = "0.7", features = ["validation"] }

# Bytes / IO
bytes = "1.7"
zstd = "0.13"
tempfile = "3.13"

# Hashing / Crypto
sha2 = "0.10"
hex = "0.4"
ring = "0.17"

# Error handling / logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# Filesystem / OS
nix = { version = "0.29", features = ["fs", "process", "user"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Bindings
# `extension-module` is opt-in per-crate (pf-py turns it on under the
# `extension-module` feature so `cargo test` can still link libpython).
pyo3 = { version = "0.22", features = ["abi3-py39", "generate-import-lib"] }
napi = { version = "2.16", features = ["napi8", "tokio_rt"] }
napi-derive = "2.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.bench]
debug = true
