# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = [
    # number_prefix is unmaintained (only used transitively via
    # indicatif → pf-cli for progress bars). Lower-severity *warning*
    # advisory (no exploit, just an "uninhabited maintainer" notice).
    # Will drop when indicatif itself swaps the dep.
    "RUSTSEC-2025-0119",
    # NOTE (v1.0.8): RUSTSEC-2025-0020 (pyo3 0.22 PyString::from_object
    # buffer-overflow) is gone — pf-py is on pyo3 0.24 now.
    # NOTE (v1.0.8): RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101)
    # are gone — switched aws-config / aws-sdk-s3 from the legacy
    # `rustls` feature (→ aws-smithy-http-client/legacy-rustls-ring →
    # rustls 0.21 / rustls-webpki 0.101) to `default-https-client`
    # (→ aws-smithy-http-client/rustls-aws-lc → rustls 0.23 /
    # rustls-webpki 0.103). `cargo tree -i rustls-webpki` now lists
    # only 0.103.13.
]

[licenses]
# Only the licenses actually present in our dep tree (verified against
# `cargo deny check licenses` on Linux x86_64). Add a license here when
# CI's cargo-deny job complains about an unmatched dep — don't pre-list
# things we wish we used; cargo-deny treats unmatched allowances as
# `unused-allowed-license` warnings (errors when run with strict).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0,
    # which is permissive and FSF/OSI-approved. Reaches us via reqwest →
    # hyper-rustls → webpki-roots → pf-registry → pf-cli.
    "CDLA-Permissive-2.0",
    # foldhash ships under Zlib (OSI-approved + FSF Free/Libre). Reaches
    # us via aws-sdk-s3 → lru → hashbrown → foldhash.
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []
# Don't fail if an entry in `allow` doesn't match a crate in the tree.
# Some workspace configs (e.g. without the `hf-live` feature) skip
# whole subgraphs; we shouldn't have to gate licenses by feature.
unused-allowed-license = "allow"

[bans]
# Mixed pyo3 + napi-rs + tokio workspaces inevitably pull in two
# versions of getrandom / linux-raw-sys / r-efi etc. via different
# transitive paths. Track for periodic cleanup but don't block CI.
multiple-versions = "allow"
wildcards = "deny"
# `cfg-if`, `windows-sys` get duplicated across the matrix; same story.
skip = []
