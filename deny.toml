# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = [
    # pyo3 0.22.x has a buffer-overflow risk in PyString::from_object
    # (https://rustsec.org/advisories/RUSTSEC-2025-0020). pf-py NEVER
    # calls PyString::from_object directly — we only use wrap_pyfunction!
    # and PyDict::new_bound. Tracked for v1.0.1: bump to pyo3 0.24+
    # (which requires reworking the #[pymodule] signature + Bound API
    # tightening). Inventoried in claude-progress.json under
    # `architecture_concerns[]`.
    "RUSTSEC-2025-0020",
    # number_prefix is unmaintained (only used via indicatif in pf-cli).
    # Lower-severity warning; tracked for v1.0.1 — likely indicatif
    # itself will swap the dep before we need to.
    "RUSTSEC-2025-0119",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",  # via aws-lc / ring's combined licence (build-only)
]
confidence-threshold = 0.9
# Some transitive deps publish a stripped LICENSE that the auto-detect
# can't grade at the default 0.92 confidence. We trust the cargo
# manifest's self-reported license string and lower the threshold a
# touch rather than dropping the gate entirely.
exceptions = []

[bans]
# Mixed pyo3 + napi-rs + tokio workspaces inevitably pull in two
# versions of getrandom / linux-raw-sys / r-efi etc. via different
# transitive paths. Track for periodic cleanup but don't block CI.
multiple-versions = "allow"
wildcards = "deny"
# `cfg-if`, `windows-sys` get duplicated across the matrix; same story.
skip = []
