# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = [
    # pyo3 0.22.x has a buffer-overflow risk in PyString::from_object
    # (https://rustsec.org/advisories/RUSTSEC-2025-0020). pf-py NEVER
    # calls PyString::from_object directly — we only use wrap_pyfunction!
    # and PyDict::new_bound. Tracked for v1.0.1: bump to pyo3 0.24+
    # (which requires reworking the #[pymodule] signature + Bound API
    # tightening). Inventoried in claude-progress.json under
    # `architecture_concerns[]`.
    "RUSTSEC-2025-0020",
    # number_prefix is unmaintained (only used via indicatif in pf-cli).
    # Lower-severity warning; tracked for v1.0.1 — likely indicatif
    # itself will swap the dep before we need to.
    "RUSTSEC-2025-0119",
]

[licenses]
# Only the licenses actually present in our dep tree (verified against
# `cargo deny check licenses` on Linux x86_64). Add a license here when
# CI's cargo-deny job complains about an unmatched dep — don't pre-list
# things we wish we used; cargo-deny treats unmatched allowances as
# `unused-allowed-license` warnings (errors when run with strict).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0,
    # which is permissive and FSF/OSI-approved. Reaches us via reqwest →
    # hyper-rustls → webpki-roots → pf-registry → pf-cli.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []
# Don't fail if an entry in `allow` doesn't match a crate in the tree.
# Some workspace configs (e.g. without the `hf-live` feature) skip
# whole subgraphs; we shouldn't have to gate licenses by feature.
unused-allowed-license = "allow"

[bans]
# Mixed pyo3 + napi-rs + tokio workspaces inevitably pull in two
# versions of getrandom / linux-raw-sys / r-efi etc. via different
# transitive paths. Track for periodic cleanup but don't block CI.
multiple-versions = "allow"
wildcards = "deny"
# `cfg-if`, `windows-sys` get duplicated across the matrix; same story.
skip = []
